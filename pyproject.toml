[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-init"
version = "0.1.0"
description = "InitA²: code for the NeurIPS manuscript Rethinking LoRA Initialization for Robust Asymmetric Learning Rates."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch==2.11.0",
    "transformers==5.3.0",
    "peft==0.18.1",
    "accelerate==1.13.0",
    "datasets==4.8.4",
    "evaluate==0.4.6",
    "numpy==2.4.3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
    "scipy>=1.14,<2",
    "matplotlib>=3.9,<4",
    "sentencepiece>=0.2,<0.3",
    "pillow>=11,<13",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
qlora = ["bitsandbytes==0.49.2"]
tracking = ["wandb==0.25.1"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "arguments",
    "checkpoint_utils",
    "coherence_logging",
    "constants",
    "initialization",
    "feature_decomposition",
    "logger",
    "model_utils",
    "train_utils",
    "trainer",
    "training_dynamics",
    "width_alignment",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
exclude = [".venv", "additional_experiments/results"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
